name: Build & Push finetune-worker

# Public repo: standard hosted runners (fair use). Still cache aggressively.
# SAFETY: push/PR build without publishing. workflow_dispatch may publish
# immutable SHA tags. Rolling *-latest tags are promoted in a separate
# latest-only dispatch by retagging the exact digest that passed GPU smoke.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.rocm"
      - "Dockerfile.axolotl.cuda"
      - ".dockerignore"
      - "worker.py"
      - "runtime_probe.py"
      - "training_config.py"
      - "display_gpu_guard.py"
      - "platform_compat.py"
      - "pause_guard.py"
      - "workspace_hygiene.py"
      - "unsloth_train.py"
      - "sft_format.py"
      - "scripts/**"
      - "pins-cuda.env"
      - "build_image.sh"
      - "select_compose.sh"
      - "docker-compose-*.yml"
      - "requirements*.txt"
      - "THIRD_PARTY_NOTICES.md"
      - "tests/**"
      - "test_finetune_pause_guard.py"
      - ".github/workflows/docker-images.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.rocm"
      - "Dockerfile.axolotl.cuda"
      - ".dockerignore"
      - "worker.py"
      - "runtime_probe.py"
      - "training_config.py"
      - "display_gpu_guard.py"
      - "platform_compat.py"
      - "pause_guard.py"
      - "workspace_hygiene.py"
      - "unsloth_train.py"
      - "sft_format.py"
      - "scripts/**"
      - "pins-cuda.env"
      - "build_image.sh"
      - "select_compose.sh"
      - "docker-compose-*.yml"
      - "requirements*.txt"
      - "THIRD_PARTY_NOTICES.md"
      - "tests/**"
      - "test_finetune_pause_guard.py"
      - ".github/workflows/docker-images.yml"
  workflow_dispatch:
    inputs:
      build_cuda:
        description: "Build NVIDIA CUDA image"
        type: boolean
        default: true
      build_rocm:
        description: "Build AMD ROCm image (expensive)"
        type: boolean
        default: false
      build_cuda_multigpu:
        description: "Build NVIDIA Axolotl multi-GPU image"
        type: boolean
        default: false
      publish_latest:
        description: "Promote one already-smoked digest to its rolling tag (latest-only)"
        type: boolean
        default: false
      gpu_smoke_family:
        description: "Image family whose already-smoked digest will be promoted"
        type: choice
        options:
          - cuda
          - rocm
          - cuda-multigpu
        default: rocm
      gpu_smoke_commit:
        description: "Full commit SHA that passed the real GPU smoke (required for latest)"
        type: string
        required: false
      gpu_smoke_digest:
        description: "Exact GHCR manifest digest that passed the real GPU smoke (required for latest)"
        type: string
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/finetune-worker

concurrency:
  group: docker-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cuda: ${{ steps.flags.outputs.cuda }}
      rocm: ${{ steps.flags.outputs.rocm }}
      cuda_multigpu: ${{ steps.flags.outputs.cuda_multigpu }}
      push: ${{ steps.flags.outputs.push }}
      publish_latest: ${{ steps.flags.outputs.publish_latest }}
      cache_to_cuda: ${{ steps.flags.outputs.cache_to_cuda }}
      cache_to_rocm: ${{ steps.flags.outputs.cache_to_rocm }}
      cache_to_cuda_multigpu: ${{ steps.flags.outputs.cache_to_cuda_multigpu }}
      promote_family: ${{ steps.flags.outputs.promote_family }}
      smoke_digest: ${{ steps.flags.outputs.smoke_digest }}
      smoke_commit: ${{ steps.flags.outputs.smoke_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'push' || github.event_name == 'pull_request'

      - name: Path filter
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            cuda_only:
              - 'Dockerfile'
              - 'pins-cuda.env'
              - 'unsloth_train.py'
              - 'scripts/**'
            rocm_only:
              - 'Dockerfile.rocm'
              - 'requirements-axolotl-rocm.txt'
              - 'requirements-bitsandbytes-rocm.txt'
            cuda_multigpu_only:
              - 'Dockerfile.axolotl.cuda'
              - 'requirements-axolotl-cuda.txt'
            shared:
              - '.dockerignore'
              - 'worker.py'
              - 'runtime_probe.py'
              - 'training_config.py'
              - 'display_gpu_guard.py'
              - 'platform_compat.py'
              - 'pause_guard.py'
              - 'workspace_hygiene.py'
              - 'sft_format.py'
            workflow:
              - '.github/workflows/docker-images.yml'

      - name: Resolve flags
        id: flags
        run: |
          set -euo pipefail
          PUSH=false
          PUBLISH_LATEST=false
          CUDA=false
          ROCM=false
          CUDA_MULTIGPU=false
          PROMOTE_FAMILY=""
          SMOKE_DIGEST=""
          SMOKE_COMMIT=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CUDA="${{ inputs.build_cuda }}"
            ROCM="${{ inputs.build_rocm }}"
            CUDA_MULTIGPU="${{ inputs.build_cuda_multigpu }}"
            PUSH=true
            PUBLISH_LATEST="${{ inputs.publish_latest }}"
            PROMOTE_FAMILY="${{ inputs.gpu_smoke_family }}"
            SMOKE_DIGEST="${{ inputs.gpu_smoke_digest }}"
            SMOKE_COMMIT="${{ inputs.gpu_smoke_commit }}"
            if [ "$PUBLISH_LATEST" = "true" ]; then
              if [ "${{ inputs.build_cuda }}" = "true" ] \
                 || [ "${{ inputs.build_rocm }}" = "true" ] \
                 || [ "${{ inputs.build_cuda_multigpu }}" = "true" ]; then
                echo "publish_latest is latest-only: run the immutable build and GPU smoke first, then dispatch with all build flags false" >&2
                exit 1
              fi
              if ! printf '%s' "$SMOKE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "publish_latest requires gpu_smoke_commit=<full 40-char commit SHA>" >&2
                exit 1
              fi
              if ! printf '%s' "$SMOKE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
                echo "publish_latest requires gpu_smoke_digest=sha256:<64 lowercase hex chars>" >&2
                exit 1
              fi
            fi
          else
            # Push/PR validate affected images but never publish.
            if [ "${{ steps.filter.outputs.cuda_only }}" = "true" ] \
               || [ "${{ steps.filter.outputs.shared }}" = "true" ] \
               || [ "${{ steps.filter.outputs.workflow }}" = "true" ]; then
              CUDA=true
            fi
            if [ "${{ steps.filter.outputs.rocm_only }}" = "true" ] \
               || [ "${{ steps.filter.outputs.shared }}" = "true" ] \
               || [ "${{ steps.filter.outputs.workflow }}" = "true" ]; then
              ROCM=true
            fi
            if [ "${{ steps.filter.outputs.cuda_multigpu_only }}" = "true" ] \
               || [ "${{ steps.filter.outputs.shared }}" = "true" ] \
               || [ "${{ steps.filter.outputs.workflow }}" = "true" ]; then
              CUDA_MULTIGPU=true
            fi
          fi
          CACHE_CUDA="type=gha,mode=max,scope=finetune-cuda"
          CACHE_ROCM="type=gha,mode=min,scope=finetune-rocm"
          CACHE_CUDA_MULTIGPU="type=gha,mode=max,scope=finetune-cuda-multigpu"
          if [ "$PUSH" = "true" ]; then
            CACHE_CUDA="$CACHE_CUDA
          type=registry,ref=${REGISTRY:-ghcr.io}/${IMAGE_NAME:-asphyksia/finetune-worker}:cuda-buildcache,mode=max"
            CACHE_ROCM="$CACHE_ROCM
          type=registry,ref=${REGISTRY:-ghcr.io}/${IMAGE_NAME:-asphyksia/finetune-worker}:rocm-buildcache,mode=max"
            CACHE_CUDA_MULTIGPU="$CACHE_CUDA_MULTIGPU
          type=registry,ref=${REGISTRY:-ghcr.io}/${IMAGE_NAME:-asphyksia/finetune-worker}:cuda-multigpu-buildcache,mode=max"
          fi
          {
            echo "cache_to_cuda<<EOFCACHE"
            echo "$CACHE_CUDA"
            echo "EOFCACHE"
            echo "cache_to_rocm<<EOFCACHE"
            echo "$CACHE_ROCM"
            echo "EOFCACHE"
            echo "cache_to_cuda_multigpu<<EOFCACHE"
            echo "$CACHE_CUDA_MULTIGPU"
            echo "EOFCACHE"
          } >> "$GITHUB_OUTPUT"
          echo "cuda=$CUDA" >> "$GITHUB_OUTPUT"
          echo "rocm=$ROCM" >> "$GITHUB_OUTPUT"
          echo "cuda_multigpu=$CUDA_MULTIGPU" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$PUBLISH_LATEST" >> "$GITHUB_OUTPUT"
          echo "promote_family=$PROMOTE_FAMILY" >> "$GITHUB_OUTPUT"
          echo "smoke_digest=$SMOKE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "smoke_commit=$SMOKE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "plan: cuda=$CUDA rocm=$ROCM cuda_multigpu=$CUDA_MULTIGPU push=$PUSH publish_latest=$PUBLISH_LATEST"

  build-cuda:
    needs: plan
    if: needs.plan.outputs.cuda == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo docker image prune -af || true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Load qualified CUDA lock
        id: cuda_pins
        run: |
          {
            echo "build_args<<EOFPINS"
            ./scripts/load_cuda_pins.sh --gha
            echo "EOFPINS"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: needs.plan.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (CUDA)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=cuda-,format=short
            type=sha,prefix=cuda-,format=long

      - name: Build CUDA
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: ${{ needs.plan.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.cuda_pins.outputs.build_args }}
          cache-from: |
            type=gha,scope=finetune-cuda
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cuda-buildcache
          cache-to: ${{ needs.plan.outputs.cache_to_cuda }}
          provenance: false
          sbom: ${{ needs.plan.outputs.push == 'true' }}

  build-rocm:
    needs: plan
    if: needs.plan.outputs.rocm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        if: needs.plan.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (ROCm)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=rocm-,format=short
            type=sha,prefix=rocm-,format=long

      - name: Build ROCm
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.rocm
          push: ${{ needs.plan.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=finetune-rocm
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rocm-buildcache
          cache-to: ${{ needs.plan.outputs.cache_to_rocm }}
          provenance: false
          sbom: ${{ needs.plan.outputs.push == 'true' }}

  build-cuda-multigpu:
    needs: plan
    if: needs.plan.outputs.cuda_multigpu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo docker image prune -af || true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        if: needs.plan.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (CUDA multi-GPU)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=cuda-multigpu-,format=short
            type=sha,prefix=cuda-multigpu-,format=long

      - name: Build CUDA multi-GPU
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.axolotl.cuda
          push: ${{ needs.plan.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=finetune-cuda-multigpu
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cuda-multigpu-buildcache
          cache-to: ${{ needs.plan.outputs.cache_to_cuda_multigpu }}
          provenance: false
          sbom: ${{ needs.plan.outputs.push == 'true' }}

  promote-latest:
    needs: [plan, unit-tests]
    if: needs.plan.outputs.publish_latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote exact GPU-smoked digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          FAMILY: ${{ needs.plan.outputs.promote_family }}
          DIGEST: ${{ needs.plan.outputs.smoke_digest }}
          COMMIT: ${{ needs.plan.outputs.smoke_commit }}
        run: |
          set -euo pipefail
          case "$FAMILY" in
            cuda) TAG="cuda-latest"; VERSION_PREFIX="cuda-" ;;
            rocm) TAG="rocm-latest"; VERSION_PREFIX="rocm-" ;;
            cuda-multigpu) TAG="cuda-multigpu-latest"; VERSION_PREFIX="cuda-multigpu-" ;;
            *) echo "unsupported GPU image family: $FAMILY" >&2; exit 1 ;;
          esac
          labels="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Image.Config.Labels}}')"
          revision="$(printf '%s' "$labels" | jq -r '."org.opencontainers.image.revision" // empty')"
          version="$(printf '%s' "$labels" | jq -r '."org.opencontainers.image.version" // empty')"
          test "$revision" = "$COMMIT" || {
            echo "image revision mismatch: expected=$COMMIT actual=$revision" >&2
            exit 1
          }
          case "$version" in
            "$VERSION_PREFIX"*) ;;
            *)
              echo "image family mismatch: expected_prefix=$VERSION_PREFIX actual_version=$version" >&2
              exit 1
              ;;
          esac
          # A single-source carbon copy preserves the exact source descriptor.
          # Do not let Buildx synthesize a new index or attach a new attestation.
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$TAG" "$IMAGE@$DIGEST"
          promoted="$(docker buildx imagetools inspect "$IMAGE:$TAG" | awk '/^Digest:/ {print $2; exit}')"
          test "$promoted" = "$DIGEST" || {
            echo "rolling tag digest mismatch: expected=$DIGEST actual=$promoted" >&2
            exit 1
          }
          echo "promoted $IMAGE:$TAG -> $DIGEST"

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r requirements-test.txt
      - name: Run worker contract tests
        run: python -m pytest tests/ test_finetune_pause_guard.py -q --tb=short
