name: Refresh Unsloth CUDA lock

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-unsloth-pins
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Resolve latest compatible lock
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          python scripts/resolve_unsloth_pins.py --write

      - name: Open review PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/refresh-unsloth-pins
          delete-branch: true
          commit-message: "chore(deps): refresh Unsloth CUDA lock"
          title: "chore(deps): refresh Unsloth CUDA lock"
          body: |
            Automated compatible pin proposal. This PR does not publish an image.

            Required before merge:
            - non-publishing CUDA image build passes
            - one-step real NVIDIA GPU mini-train passes
            - resulting commit is promoted manually only after the GPU evidence is recorded
          labels: dependencies,finetune-gpu-gate
