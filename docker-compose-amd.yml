# Fine-tune worker compose — AMD ROCm
# Fetched by provider nodes from the source ImageEnvironments URL.
#
# Services:
# - openreef-signer: CPU-only; holds PROVIDER_PRIVATE_KEY; D2 claims
# - finetune: GPU train; no private key; claims via signer
#
# Critical provider notes:
# - group "991" is the usual host `render` GID (/dev/kfd + /dev/dri/renderD*).
#   Use numeric GID: Docker resolves names from the *container* /etc/group.
#   If `getent group render` on the host is not 991, change this value.
# - Never set HSA_OVERRIDE_GFX_VERSION to an empty string — it breaks HSA.
#   Only add that env when a specific gfx override is required.
# - Application code lives at /app in the image; /data→/workspace is job I/O only.
#
# Logging:
# - docker logs <container>
# - Host data dir (mapped to /data): logs/openreef_worker.log and OPENREEF_LOGS.txt

services:
  openreef-signer:
    # Pin after green smoke: OPENREEF_SIGNER_IMAGE=ghcr.io/asphyksia/openreef-signer@sha256:…
    image: ${OPENREEF_SIGNER_IMAGE:-ghcr.io/asphyksia/openreef-signer:latest}
    pull_policy: always
    restart: unless-stopped
    # No host ports — only reachable on the compose network as openreef-signer:8787
    environment:
      - PROVIDER_PRIVATE_KEY=${PROVIDER_PRIVATE_KEY:-}
      - OPENREEF_API_BASE=${OPENREEF_API_BASE:-https://openreef.network}
      - OPENREEF_SIGNER_ALLOWED_API_BASES=${OPENREEF_SIGNER_ALLOWED_API_BASES:-https://openreef.network}
      - OPENREEF_SIGNER_TOKEN=${OPENREEF_SIGNER_TOKEN:-}
      - OPENREEF_CHAIN_ID=${OPENREEF_CHAIN_ID:-}
      - OGPU_USE_TESTNET=${OGPU_USE_TESTNET:-}
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        labels: "openreef,signer"

  finetune:
    # Pin after green smoke: FINETUNE_IMAGE=ghcr.io/asphyksia/finetune-worker@sha256:…
    image: ${FINETUNE_IMAGE:-ghcr.io/asphyksia/finetune-worker:rocm-latest}
    pull_policy: always
    depends_on:
      - openreef-signer
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
    group_add:
      - video
      - "991"
    ipc: host
    shm_size: "16G"
    cap_add:
      - SYS_PTRACE
    volumes:
      - /data:/workspace
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - OPENREEF_PROVIDER_ENV=amd_rocm
      - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
      - CALLBACK_URL=${CALLBACK_URL:-}
      # Claim via external signer (PK stays on openreef-signer only).
      - OPENREEF_SIGNER_URL=http://openreef-signer:8787
      - OPENREEF_SIGNER_TOKEN=${OPENREEF_SIGNER_TOKEN:-}
      - OPENREEF_API_BASE=${OPENREEF_API_BASE:-https://openreef.network}
      - OPENREEF_LOG_DIR=/workspace/logs
      - PYTHONUNBUFFERED=1
      - OPENREEF_HOST_OS=${OPENREEF_HOST_OS:-}
      - OPENREEF_HOST_VIRT=${OPENREEF_HOST_VIRT:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${PORT}:5555
    command: ["--config", "/workspace/config.json"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
        labels: "openreef,finetune,amd"
