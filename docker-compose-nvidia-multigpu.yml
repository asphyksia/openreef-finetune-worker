# Fine-tune worker compose - NVIDIA CUDA multi-GPU (Axolotl)
# Explicit opt-in: this image is separate from single-GPU CUDA Unsloth.

services:
  openreef-signer:
    image: ${OPENREEF_SIGNER_IMAGE:-ghcr.io/asphyksia/openreef-signer:latest}
    pull_policy: always
    restart: on-failure:3
    environment:
      - PROVIDER_PRIVATE_KEY=${PROVIDER_PRIVATE_KEY:-}
      - OPENREEF_API_BASE=${OPENREEF_API_BASE:-https://openreef.network}
      - OPENREEF_SIGNER_ALLOWED_API_BASES=${OPENREEF_SIGNER_ALLOWED_API_BASES:-https://openreef.network}
      - OPENREEF_SIGNER_TOKEN=${OPENREEF_SIGNER_TOKEN:-}
      - OPENREEF_CHAIN_ID=${OPENREEF_CHAIN_ID:-}
      - OGPU_USE_TESTNET=${OGPU_USE_TESTNET:-}
      - OPENREEF_UPDATE_FILE=/openreef-control/updating
      - OPENREEF_PAUSE_FILE=/openreef-control/paused
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /data/openreef-control:/openreef-control:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        labels: "openreef,signer"

  finetune:
    # Pin after a real multi-GPU smoke; do not use this rolling tag in an incident.
    image: ${FINETUNE_IMAGE:-ghcr.io/asphyksia/finetune-worker:cuda-multigpu-latest}
    pull_policy: always
    depends_on:
      - openreef-signer
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /data:/workspace
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - OPENREEF_PROVIDER_ENV=nvidia_cuda
      - OPENREEF_TRAIN_ENGINE=axolotl
      - OPENREEF_NUM_GPUS=${OPENREEF_NUM_GPUS:-}
      - CALLBACK_URL=${CALLBACK_URL:-}
      - OPENREEF_SIGNER_URL=http://openreef-signer:8787
      - OPENREEF_SIGNER_TOKEN=${OPENREEF_SIGNER_TOKEN:-}
      - OPENREEF_API_BASE=${OPENREEF_API_BASE:-https://openreef.network}
      - OPENREEF_LOG_DIR=/workspace/logs
      - OPENREEF_UPDATE_FILE=/workspace/openreef-control/updating
      - OPENREEF_ACTIVE_FILE=/workspace/openreef-control/training.active
      - OPENREEF_PAUSE_FILE=/workspace/openreef-control/paused
      - PYTHONUNBUFFERED=1
      - OPENREEF_HOST_OS=${OPENREEF_HOST_OS:-}
      - OPENREEF_HOST_VIRT=${OPENREEF_HOST_VIRT:-}
      - TORCH_DISABLE_NATIVE_JIT=${TORCH_DISABLE_NATIVE_JIT:-1}
      - TORCHDYNAMO_DISABLE=${TORCHDYNAMO_DISABLE:-1}
      - TORCH_COMPILE_DISABLE=${TORCH_COMPILE_DISABLE:-1}
      - OPENREEF_FORCE_EAGER_TORCH=${OPENREEF_FORCE_EAGER_TORCH:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${PORT}:5555
    command: ["--config", "/workspace/config.json"]
    runtime: nvidia
    restart: on-failure:3
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
        labels: "openreef,finetune,nvidia,multigpu"
